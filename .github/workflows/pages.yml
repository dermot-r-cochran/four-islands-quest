name: Pages

# Serves index.html from GitHub Pages on every push to main, and beside it
# a page the sandbox writes: one tide-cycle of the Sounds, seeded by the
# date, at /sounds/. Nothing is installed — the sandbox is standard
# library — and the tools and the README stay in the repository. The
# daily schedule re-runs the same job so the Sounds tick over once a day
# for every reader; the same day gives the same Sounds to everyone.
# (GitHub pauses scheduled workflows after sixty days without a commit;
# a push or a manual run wakes them.)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the quest
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Tick the Sounds over for today
        run: |
          python3 sandbox/ecosystem.py --check
          python3 sandbox/ecosystem.py --seed "$(date -u +%Y%m%d)" \
            --date "$(date -u +%F)" --html _site/sounds/index.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs,
          # with GitHub Actions as its source.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
