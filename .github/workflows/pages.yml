name: Pages

# Serves index.html from GitHub Pages on every push to main, and beside it
# three pages the sandbox writes, seeded by the date: one tide-cycle of
# the Sounds at /sounds/, Fourth Island's own account at /fourth/, and the
# open sea at /sea/. Nothing
# is installed — the sandbox is standard library — and the tools and the
# README stay in the repository. The daily schedule re-runs the same job
# so both tick over once a day for every reader; the same day gives the
# same Sounds, and the same island, to everyone.
# (GitHub pauses scheduled workflows after sixty days without a commit;
# a push or a manual run wakes them.)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the quest
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Tick the Sounds, Fourth Island and the sea over for today
        run: |
          python3 sandbox/ecosystem.py --check
          python3 sandbox/ecosystem.py --seed "$(date -u +%Y%m%d)" \
            --date "$(date -u +%F)" --html _site/sounds/index.html
          python3 sandbox/ecosystem.py --edition fourth --seed "$(date -u +%Y%m%d)" \
            --date "$(date -u +%F)" --html _site/fourth/index.html
          python3 sandbox/ecosystem.py --edition sea --seed "$(date -u +%Y%m%d)" \
            --date "$(date -u +%F)" --html _site/sea/index.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs,
          # with GitHub Actions as its source.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
