name: Pages

# Serves index.html from GitHub Pages on every push to main. The engine is
# one file with no build, so the whole job is: copy that file into a
# staging directory and hand it to Pages. Nothing is installed, and the
# tools, the sandbox and the README stay in the repository rather than on
# the site — the site is the quest, nothing else.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage the one file
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository the first time this runs,
          # with GitHub Actions as its source.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
